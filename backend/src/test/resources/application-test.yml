# Pruebas automáticas. La base la levanta Testcontainers (TestcontainersConfiguration),
# así que aquí no se configura el datasource.
app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secreto: clave-de-prueba-con-mas-de-32-caracteres
  fotos:
    directorio: target/fotos-prueba

spring:
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.huertos: INFO
    org.testcontainers: INFO
