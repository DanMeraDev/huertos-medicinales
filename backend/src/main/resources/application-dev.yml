# Desarrollo en la máquina de cada integrante, con la base de docker-compose.
spring:
  config:
    # Lee el .env de la raíz del repo, tanto si se ejecuta desde backend/ (IntelliJ, terminal)
    # como desde la raíz (VS Code). Las variables de entorno reales tienen prioridad.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:${DB_PORT:3306}/${DB_NAME:huertos}}
    username: ${DB_USER:huertos}
    password: ${DB_PASSWORD:huertos}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:${WEB_PORT:5173}}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.huertos: DEBUG
