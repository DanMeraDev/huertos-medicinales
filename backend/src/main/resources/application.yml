# Configuración común a todos los perfiles. Lo propio de cada entorno va en application-<perfil>.yml.
spring:
  application:
    name: huertos-api
  profiles:
    default: dev
  jpa:
    # El esquema lo controla Flyway; Hibernate solo valida que las entidades coincidan.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:${API_PORT:8080}}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:1440}
  correo:
    remitente: ${MAIL_FROM:no-responder@huertos.gob.ec}
    url-frontend: ${FRONTEND_URL:http://localhost:5173}
  admin:
    correo: ${ADMIN_EMAIL:}
    contrasena: ${ADMIN_PASSWORD:}
    fecha-nacimiento: ${ADMIN_FECHA_NACIMIENTO:}
