# Configuración común a todos los perfiles. Lo propio de cada entorno va en application-<perfil>.yml.
spring:
  application:
    name: huertos-api
  profiles:
    default: dev
  jpa:
    # El esquema lo controla Flyway; Hibernate solo valida que las entidades coincidan.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:${API_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
