spring:
  application:
    name: huertos-api
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/huertos}
    username: ${DB_USER:huertos}
    password: ${DB_PASSWORD:huertos}
  jpa:
    # El esquema lo controla Flyway; Hibernate solo valida que las entidades coincidan.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
